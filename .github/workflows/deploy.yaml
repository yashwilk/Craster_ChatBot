name: Build and push to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sanitize repository name
        id: sanitize
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          echo "REPO_NAME=${REPO_NAME}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg APP_ENV=production -t craster-agent:production .

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' && env.DOCKER_USERNAME != '' }}
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image
        if: ${{ github.event_name == 'push' && env.DOCKER_USERNAME != '' }}
        run: |
          docker tag craster-agent:production ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}:production
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}:production
