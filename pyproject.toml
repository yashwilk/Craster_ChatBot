[project]
name = "craster-agent"
version = "0.1.0"
description = "Craster product & sales assistant — FastAPI + LangGraph agent with Acumatica GI tool calling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langchain-community>=0.4.1",
    "langfuse==3.9.1",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.2",
    "psycopg2-binary>=2.9.10",
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.4.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.25",
    "structlog>=25.2.0",
    "uvicorn>=0.34.0",
    "bcrypt>=4.3.0",
    "slowapi>=0.1.9",
    "email-validator>=2.2.0",
    "prometheus-client>=0.19.0",
    "starlette-prometheus>=0.7.0",
    "asgiref>=3.8.1",
    "ddgs>=9.6.0",
    "tenacity>=9.1.2",
    "mem0ai>=1.0.0",
    "asgi-correlation-id>=4.3.4",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11.4", "pyright>=1.1.390", "pyinstrument>=5.1.2", "pre-commit>=4.5.1", "detect-secrets>=1.5.0"]
cache = ["redis>=7.4.0"]

[dependency-groups]
test = ["httpx>=0.28.1", "pytest>=8.3.5"]

[tool.ruff]
line-length = 119
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["app", "evals"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
